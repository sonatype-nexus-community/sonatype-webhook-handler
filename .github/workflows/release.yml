name: Release

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    LC_APPLICATION_ID: sonatype-webhook-handler
    NODE_VERSION: '18.x'

permissions:
    contents: write

jobs:
    release:
        name: Build, Release and Publish
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.REGISTRY_USERNAME }}
                  password: ${{ secrets.REGISTRY_TOKEN }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Build
              run: npm i && npm run build && npm run test:unit

            - name: Build Container and export to Docker
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  load: true
                  platforms: linux/arm64,linux/amd64
                  tags: sonatypecommunity/sonatype-webhook-handler:${{ github.sha }}

            - name: Sonatype Lifecycle Evaluation
              id: evaluate
              uses: sonatype/actions/evaluate@v1
              with:
                  iq-server-url: ${{ vars.SONATYPE_PLATFORM_URL }}
                  username: ${{ secrets.SONATYPE_LIFECYCLE_USERNAME }}
                  password: ${{ secrets.SONATYPE_LIFECYCLE_PASSWORD }}
                  application-id: ${{ env.LC_APPLICATION_ID }}
                  scan-targets: 'container:docker.io/sonatypecommunity/sonatype-webhook-handler:${{ github.sha }} .'
                  stage: release

            - name: Semantic Release
              run: npx semantic-release

            - name: Determine Version
              run: echo "NEW_VERSION=$(npm version | grep 'sonatype-webhook-handler' | cut -d "'" -f4)" >> $GITHUB_ENV

            - name: Build and Publish
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  platforms: linux/arm64,linux/amd64
                  tags: sonatypecommunity/sonatype-webhook-handler:latest , sonatypecommunity/sonatype-webhook-handler:${{ env.NEW_VERSION }}